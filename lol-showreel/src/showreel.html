<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Line Lane Legend</title>
<!--
  LINE → LANE → LEGEND — a 15 s League of Legends motion reel.
  One gold line tears open into a whole match and closes back into itself.

  Rules: 120 BPM (beat = 0.5 s, bar = 2 s), 7½ bars. Cinzel only (outlines baked in
  GLYPHS). Palette: gold / blue / red + black + white. Camera: locked on the vertical
  centre line (= mid lane); it only pushes forward and tilts on its horizontal hinge.

  Everything on screen is a pure function of time: window.seek(t) rebuilds the whole
  SVG frame from t. No CSS animation, no timers, nothing carried between frames.
  window.renderAudio() renders the soundtrack offline and returns a base64 WAV.
-->
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  #stage { display: block; width: 1920px; height: 1080px; background: #000; }
</style>
</head>
<body>
<svg id="stage" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
<script>
'use strict';
const GLYPHS = /*__GLYPHS__*/null;

// ═══════════════════════════ constants ═══════════════════════════
const W = 1920, H = 1080, CX = 960, CY = 540;
const BPM = 120, BEAT = 60 / BPM, DUR = 15, FPS = 60;
const DT = 1 / 180;                         // velocity probe = one render subframe
const BLUR_K = 0.2, BLUR_MAX = 46, BLUR_MIN = 0.6;
const GOLD = '#C8AA6E', BLUE = '#0AC8B9', RED = '#E84057', WHITE = '#FFFFFF', BLACK = '#000000';
const LANE = 6;                             // lane stroke, world units (= px in the top view)
const bt = (n) => (n - 1) * BEAT;           // start time of beat n (1-based)

// ═══════════════════════════ math / easing ═══════════════════════════
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);

  const wd = w * Math.sqrt(1 - z * z);

const n1 = (v) => Math.round(v * 10) / 10;
const n2 = (v) => Math.round(v * 100) / 100;

const RUN = {};

      idx, ch: g.ch, x: g.x, adv: g.adv, cx: g.x + g.adv / 2, lc: g.adv / 2, bb: g.bb, dl: localD(g.d), d: g.d,

const gX = (run, g, size, cx) => cx + (g.cx - run.width / 2) * (size / UPM);

// one glyph as an SVG path; (gx, gy) = advance-centre on the baseline; sx/sy scale about it
function glyphStr(g, size, gx, gy, sx, sy, fill) {
  if (Math.abs(sx) < 1e-3 || Math.abs(sy) < 1e-3) return '';
  const s = size / UPM, a = s * sx, d = s * sy, e = gx - a * g.lc;
  return `<path d="${g.dl}" fill="${fill}" transform="matrix(${n4(a)} 0 0 ${n4(d)} ${n2(e)} ${n2(gy)})"/>`;

function glyphBox(g, size, gx, gy, sx, sy) {

  return [e + a * g.bb[0], gy - d * g.bb[3], e + a * g.bb[2], gy - d * g.bb[1]];
}
function runStr(key, size, cx, base, fill, dx = 0, dy = 0) {
  const run = RUN[key];

  return s;

// tabular counter string, right-aligned at xr

  let x = xr - advs.reduce((a, b) => a + b, 0);
  let out = '';
  [...text].forEach((ch, i) => {
    const g = CNT[ch];
    out += glyphStr(g, size, x + advs[i] / 2, base, scale, scale, fill);
    x += advs[i];

// ═══════════════════════════ frame / display list ═══════════════════════════
class Frame {
  constructor(t) { this.t = t; this.defs = []; this.items = []; this.n = 0; }
  uid(p) { return p + this.n++; }
  def(s) { this.defs.push(s); }
  clipRect(x, y, w, h) {
    const id = this.uid('c');
    this.def(`<clipPath id="${id}"><rect x="${n1(x)}" y="${n1(y)}" width="${n1(Math.max(0, w))}" height="${n1(Math.max(0, h))}"/></clipPath>`);
    return id;
  }
  clipPath(d) {
    const id = this.uid('c');
    this.def(`<clipPath id="${id}"><path d="${d}"/></clipPath>`);
    return id;
  }
  // svg: markup; mb: motion-blur probe {id, ax, ay, bb}; clip: id of a static clip applied outside the blur
  add(svg, mb = null, clip = null) { if (svg) this.items.push({ svg, mb, clip }); }
}
const lineStr = (x1, y1, x2, y2, c, w, cap = 'round') =>
  `<line x1="${n1(x1)}" y1="${n1(y1)}" x2="${n1(x2)}" y2="${n1(y2)}" stroke="${c}" stroke-width="${n2(w)}" stroke-linecap="${cap}"/>`;
const vline = (Fr, id, x, ym, hh, c, w = 6) => {
  if (hh <= 0.05) return;
  Fr.add(lineStr(x, ym - hh, x, ym + hh, c, w), id ? { id, ax: x, ay: ym, bb: [x - w, ym - hh - w, x + w, ym + hh + w] } : null);
};

// ═══════════════════════════ 3D ═══════════════════════════
const FOCAL = 1484;                          // ≈40° vertical field of view
const NEAR = 8;
function orbitCam(pivot, phiDeg, D, ortho = 0) {   // looks at pivot from distance D, pitched down by phi
  const p = (phiDeg * Math.PI) / 180, s = Math.sin(p), c = Math.cos(p);
  return { pos: [pivot[0], pivot[1] + D * s, pivot[2] - D * c], f: [0, -s, c], u: [0, c, s], F: FOCAL, D, ortho };
}
function toCam(cam, P) {                     // world → camera (x right, y up, z forward)
  const x = P[0] - cam.pos[0], y = P[1] - cam.pos[1], z = P[2] - cam.pos[2];
  return [x, y * cam.u[1] + z * cam.u[2], y * cam.f[1] + z * cam.f[2]];
}
const scaleAt = (cam, q) => (cam.ortho ? lerp(cam.F / q[2], cam.F / cam.D, cam.ortho) : cam.F / q[2]);
const toScr = (cam, q) => { const k = scaleAt(cam, q); return [CX + q[0] * k, CY - q[1] * k]; };

const nearCut = (a, b) => { const k = (NEAR - a[2]) / (b[2] - a[2]); return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, NEAR]; };

const dPoly = (s) => (s.length > 2 ? 'M' + s.map((p) => n1(p[0]) + ' ' + n1(p[1])).join('L') + 'Z' : '');
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];

// ═══════════════════════════ BAR 1 — HOOK: FIRST BLOOD ═══════════════════════════

  const split = bt(3) + 0.04;
  if (t < split) {
    RF.glyphs.forEach((g, i) => {
      const gx = CX + (gX(RF, g, HK.size, CX) - CX) * open, sx = Math.max(open, 0.0015);
      Fr.add(glyphStr(g, HK.size, gx, baseF, sx, 1, GOLD), { id: 'F' + i, ax: gx, ay: baseF - cap / 2, bb: glyphBox(g, HK.size, gx, baseF, sx, 1) });
    });
    if (t >= bt(2)) {
      const clip = Fr.clipRect(0, 0, W, HK.baseB + 7);
      RB.glyphs.forEach((g, i) => {
        const gx = gX(RB, g, HK.size, CX), dy = 200 * (1 - bloodRise(i));
        Fr.add(glyphStr(g, HK.size, gx, HK.baseB + dy, 1, 1, RED), { id: 'B' + i, ax: gx, ay: HK.baseB + dy - cap / 2, bb: glyphBox(g, HK.size, gx, HK.baseB + dy, 1, 1) }, clip);
      });
    }
  } else if (q < 0.999) {
    // beat 3: the blade has crossed, the halves slip along the cut.
    // beat 4: two gold lines slam down on the block's outer edges and close in to ±400 while the
    // halves slide outward into them — swallowed like paper into a slot. The rift opens in the middle.
    const slip = 14 * ex(t, split, 0.3, 6) * (1 - q);
    const content = runStr('FIRST', HK.size, CX, baseF, GOLD) + runStr('BLOOD', HK.size, CX, HK.baseB, RED);
    for (const sg of [-1, 1]) {
      const dx = sg * HK.side * q, dy = -sg * slip;
      const lx = CX + sg * lerp(HK.edge, HK.side, q);
      const local = Fr.clipRect(sg < 0 ? 0 : CX, 0, sg < 0 ? CX : W - CX, H);
      const screen = sg < 0 ? Fr.clipRect(lx, 0, W - lx, H) : Fr.clipRect(0, 0, lx, H);
      const hx0 = sg < 0 ? CX - HK.edge : CX, hx1 = sg < 0 ? CX : CX + HK.edge;
      Fr.add(`<g transform="translate(${n2(dx)} ${n2(dy)})"><g clip-path="url(#${local})">${content}</g></g>`,
        { id: 'half' + sg, ax: (hx0 + hx1) / 2 + dx, ay: CY + dy, bb: [hx0 + dx, 330 + dy, hx1 + dx, 750 + dy] }, screen);
    }
  }
  // the blade: drawn on beat 3, grows into the mid lane on beat 4
  if (t >= bt(3)) {
    const yTop = lerp(HK_BLADE[0], 140, ex(t, bt(4), 0.45, 6));
    const yBot = lerp(HK_BLADE[1], 940, ex(t, bt(4), 0.45, 6));
    const lead = lerp(HK_BLADE[0], HK_BLADE[1], ex(t, bt(3), 0.13, 6));
    const y2 = t < bt(4) ? lead : yBot;
    Fr.add(lineStr(CX, yTop, CX, y2, mix(WHITE, GOLD, ex(t, bt(4) + 0.12, 0.36, 6)), 6), { id: 'blade', ax: CX, ay: y2, bb: [CX - 6, yTop, CX + 6, y2] });
  }
  // the slot lines stay behind as the future top and bot lanes
  if (t >= bt(4)) {
    const hh = 215 * ex(t, bt(4), 0.07, 5) + 185 * ex(t, bt(4) + 0.12, 0.4, 6);
    const lx = lerp(HK.edge, HK.side, q);
    vline(Fr, 'sideL', CX - lx, CY, hh, GOLD);
    vline(Fr, 'sideR', CX + lx, CY, hh, GOLD);
  }
}

// ═══════════════════════════ BARS 2–4 — THE RIFT (2D → 3D → DATA) ═══════════════════════════
// world: X right, Z up-screen (top view), Y height. Diamond map: blue base bottom, red base top.
const MID = [[0, -400], [0, 400]];
function sideLane(sg, fold) {                // sg -1 = top lane (left), +1 = bot lane (right)
  const th = (Math.PI / 4) * fold, len = lerp(400, 400 * Math.SQRT2, fold), jx = 400 * sg;
  const ex_ = jx - sg * len * Math.sin(th);
  return [[ex_, -len * Math.cos(th)], [jx, 0], [ex_, len * Math.cos(th)]];
}
const LANES_FINAL = [sideLane(-1, 1), MID, sideLane(1, 1)];
const TOWER_S = [0.17, 0.29, 0.41, 0.59, 0.71, 0.83];
const TOWERS = [];
LANES_FINAL.forEach((lane, li) => TOWER_S.forEach((s, j) => {
  const p = along(lane, s);
  TOWERS.push({ li, s, X: p[0], Z: p[1], team: s < 0.5 ? 'b' : 'r', ring: j < 3 ? 2 - j : j - 3 });
}));
{
  const red = TOWERS.filter((w) => w.team === 'r').sort((a, b) => a.X - b.X || b.Z - a.Z);
  const blue = TOWERS.filter((w) => w.team === 'b').sort((a, b) => a.X - b.X || a.Z - b.Z);
  red.forEach((w, i) => { w.col = i; });
  blue.forEach((w, i) => { w.col = 9 + i; });
}
// gold difference, minutes 2…36 (K): red leads early, blue comes back
const GD = [-0.3, -0.8, -0.6, -1.4, -1.1, -2.0, -2.4, -1.7, -0.9, 0.4, 1.1, 0.8, 1.9, 2.7, 2.2, 3.6, 4.6, 5.8];
const COLX = (k) => -510 + 60 * k;
const COLW = 15;                             // column half-width (world)
const VSC = 38;                              // world units per 1K gold
const AXIS_HALF = 650;                       // the flattened map's half-length
const MAP_PUSH = 0.86;                       // extra push-in that rides the tilt
const CHART = [[COLX(0) - 2 * COLW, 0], ...GD.map((v, k) => [COLX(k), v * VSC])];
function chartY(x, vs) {                     // gold-diff line height at chart x
  if (x <= CHART[0][0]) return 0;
  for (let i = 0; i < CHART.length - 1; i++) {
    const a = CHART[i], b = CHART[i + 1];
    if (x <= b[0]) return lerp(a[1], b[1], (x - a[0]) / (b[0] - a[0])) * vs;
  }
  return CHART[CHART.length - 1][1] * vs;
}

const mapPush = (t) => Math.exp(-0.022 * Math.max(0, t - 2)) * lerp(1, MAP_PUSH, ex(t, bt(9), 0.6, 5));
function mapCam(t) {
  const D = FOCAL * mapPush(t);                                   // slow push-in, deeper on the tilt
  let phi = lerp(90, 36, ex(t, bt(9), 0.5, 5.5));                 // beat 9: the hinge tilts
  phi = lerp(phi, 0, ex(t, bt(14), 0.45, 6));                     // beat 14: face the chart
  // the hinge sits a little toward the blue side while the map stands up, so both bases stay in frame
  const hz = -70 * ex(t, bt(9), 0.5, 5.5) * (1 - ex(t, bt(13), 0.45, 6));
  return orbitCam([0, 0, hz], phi, D, ex(t, bt(14), 0.5, 5));
}

function towerState(w, t) {
  const pop = spr(t - bt(8) - 0.045 * w.ring, 3.2, 0.72, 7);
  const tx = w.team === 'b' ? bt(10) : bt(11);
  const hUp = (80 + 14 * (2 - w.ring)) * spr(t - tx - 0.035 * w.ring, 2.8, 0.74, 6);
  const g = ex(t, bt(13) + 0.012 * w.col, 0.5, 6);
  return {
    X: lerp(w.X, COLX(w.col), g), Z: lerp(w.Z, 0, g), rot: lerp(Math.PI / 4, 0, g),
    a: lerp(13 * pop, COLW, g), h: lerp(hUp, GD[w.col] * VSC, g), sw: 2 * (1 - g), pop, g,
  };
}

function mapWorld(Fr, t) {
  const cam = mapCam(t);
  const scl = FOCAL / cam.D;
  const fold = ex(t, bt(5), 0.45, 6);
  const sq = ex(t, bt(13), 0.45, 6);
  const SQ = (p) => [p[0] * lerp(1, AXIS_HALF / 400, sq), p[1] * lerp(1, 0.02, sq)];
  const front = t >= bt(14) + 0.12;          // chart view: the axis sits on top of the columns

  // slab: the map gains thickness as it tilts (2D → 3D), loses it as it flattens into the axis
  const th = 28 * ex(t, bt(9), 0.5, 5.5) * (1 - sq);
  if (th > 0.4) {
    const v = [[0, -400], [-400, 0], [0, 400], [400, 0]].map(SQ);
    let s = '';
    for (let i = 0; i < 4; i++) {
      const a = v[i], b = v[(i + 1) % 4];
      const f = [[a[0], 0, a[1]], [b[0], 0, b[1]], [b[0], -th, b[1]], [a[0], -th, a[1]]];
      const r = solidStr(cam, [f], [0, -th / 2, 0], BLACK, GOLD, 3);
      if (r) s += r.svg;
    }
    Fr.add(s);
  }

  // lanes
  const lanes = [sideLane(-1, fold), MID, sideLane(1, fold)].map((l) => l.map(SQ));
  const drawLanes = () => lanes.forEach((l) => floorStroke(Fr, cam, l, GOLD, LANE));
  if (!front) drawLanes();

  // beat 6: the river crosses and bends into an S
  if (t >= bt(6) && sq < 0.999) {
    const rl = 400 * ex(t, bt(6), 0.32, 6) * (1 - sq), A = 55 * spr(t - bt(6) - 0.06, 3, 0.72) * (1 - sq);
    const pts = [];
    for (let i = 0; i <= 40; i++) { const X = lerp(-rl, rl, i / 40); pts.push(SQ([X, -A * Math.sin((Math.PI * X) / 400)])); }
    floorStroke(Fr, cam, pts, BLUE, 10, 30);
  }

  // beat 7: base vertices inflate into circles that become hexagon rings
  const baseR = 56 * spr(t - bt(7), 3.4, 0.74, 5);
  const hexm = ex(t, bt(7) + 0.08, 0.32, 6);
  if (baseR > 0.5 && sq < 0.999) {
    for (const [cz, col] of [[-400, BLUE], [400, RED]]) {
      const ring = [];
      for (let i = 0; i < 72; i++) {
        const a = (i / 72) * Math.PI * 2;
        const sect = (((a - Math.PI / 2) % (Math.PI / 3)) + Math.PI / 3) % (Math.PI / 3);
        const rh = (baseR * 1.04 * Math.cos(Math.PI / 6)) / Math.cos(sect - Math.PI / 6);
        const r = lerp(baseR, rh, hexm) * (1 - sq);
        ring.push(SQ([r * Math.cos(a), cz + r * Math.sin(a)]));
      }
      ring.push(ring[0]);
      floorStroke(Fr, cam, ring, col, LANE, 400);
    }
  }

  // objects: towers (beat 8 pop, beats 10/11 extrude, beat 13 become columns) + nexus crystals
  const objs = [];
  if (t >= bt(8) && t < bt(16)) {
    TOWERS.forEach((w, i) => {
      const st = towerState(w, t);
      if (st.a < 0.3) return;
      const col = w.team === 'b' ? BLUE : RED;
      const center = [st.X, st.h / 2, st.Z];
      let r;
      if (Math.abs(st.h) < 0.5) {
        const c = Math.cos(st.rot), s = Math.sin(st.rot), a = st.a;
        const ft = [[-a, -a], [a, -a], [a, a], [-a, a]].map(([x, z]) => [st.X + x * c - z * s, st.Z + x * s + z * c]);
        const d = floorPolyStr(cam, ft);
        const ps = ft.map(([x, z]) => proj(cam, [x, 0, z])).filter(Boolean);
        r = { svg: `<path d="${d}" fill="${col}"/>`, bb: [Math.min(...ps.map((p) => p[0])), Math.min(...ps.map((p) => p[1])), Math.max(...ps.map((p) => p[0])), Math.max(...ps.map((p) => p[1]))] };
      } else {
        r = solidStr(cam, obeliskFaces(st.X, st.Z, st.a, st.rot, st.h, lerp(0.62, 1, st.g), lerp(0.22, 0, st.g)), center, col, BLACK, st.sw);
      }
      if (!r) return;
      const c2 = proj(cam, center) || [CX, CY];
      objs.push({ z: toCam(cam, center)[2], svg: r.svg, mb: { id: 'tw' + i, ax: c2[0], ay: c2[1], bb: r.bb } });
    });
  }
  // nexus crystals: the inner hexagon (beat 7) rises into a spinning crystal (beat 12)
  if (t >= bt(7) && t < bt(13) + 0.5) {
    const rise = spr(t - bt(12), 2.6, 0.76, 5);
    const fly = ex(t, bt(13), 0.45, 6);
    const yaw = t > bt(12) ? (t - bt(12)) * 1.7 : 0;
    for (const [team, cz, col, ax] of [['b', -400, BLUE, AXIS_HALF], ['r', 400, RED, -AXIS_HALF]]) {
      const r0 = 0.5 * baseR * ex(t, bt(7) + 0.12, 0.3, 6);
      const k = 1 - fly;
      const r = lerp(r0, 27, rise) * k;
      if (r < 0.4) continue;
      const cy = lerp(0, 72, rise) * k, cx = lerp(0, ax, fly), czz = lerp(cz, 0, fly);
      const faces = crystalFaces(cx, cy, czz, r, lerp(0, 56, rise) * k, lerp(0, 56, rise) * k, yaw + Math.PI / 6);
      const sres = solidStr(cam, faces, [cx, cy, czz], col, BLACK, 2 * rise);
      if (!sres) continue;
      const c2 = proj(cam, [cx, cy, czz]) || [CX, CY];
      objs.push({ z: toCam(cam, [cx, cy, czz])[2], svg: sres.svg, mb: { id: 'nx' + team, ax: c2[0], ay: c2[1], bb: sres.bb } });
    }
  }
  objs.sort((a, b) => b.z - a.z).forEach((o) => Fr.add(o.svg, o.mb));

  // ── chart (beats 14–17) ──
  if (t >= bt(14)) {
    const axis = proj(cam, [0, 0, 0]);
    const P = (X, Y) => proj(cam, [X, Y, 0]);
    const fl = ex(t, bt(17), 0.1, 6), vs = 1 - fl;
    // beat 16: columns widen and their tops melt into the curve: the area chart
    if (t >= bt(16)) {
      const am = ex(t, bt(16), 0.4, 6);
      let d = '';
      GD.forEach((v, k) => {
        const w = lerp(COLW, 2 * COLW, am), xl = COLX(k) - w, xr = COLX(k) + w;
        const yl = lerp(v * VSC * vs, chartY(xl, vs), am), yr = lerp(v * VSC * vs, chartY(xr, vs), am);
        d += dPoly([P(xl, 0), P(xl, yl), P(xr, yr), P(xr, 0)]);
      });
      const cu = Fr.clipRect(0, 0, W, axis[1]), cd = Fr.clipRect(0, axis[1], W, H - axis[1]);
      Fr.add(`<path d="${d}" fill="${BLUE}"/>`, null, cu);
      Fr.add(`<path d="${d}" fill="${RED}"/>`, null, cd);
    }
    if (front) drawLanes();
    // beat 15: the line draws through the column tops, a counter rides its tip
    if (t >= bt(15)) {
      const lp = ex(t, bt(15), 0.42, 5);
      const pts = polySlice(CHART.map(([x, y]) => [x, y * vs]), 0, lp);
      if (pts.length > 1) {
        const sp = pts.map(([x, y]) => P(x, y));
        Fr.add(`<polyline points="${sp.map((p) => n1(p[0]) + ',' + n1(p[1])).join(' ')}" fill="none" stroke="${GOLD}" stroke-width="${n2(5 * scl)}" stroke-linejoin="round" stroke-linecap="round"/>`);
        const tip = pts[pts.length - 1], tipS = sp[sp.length - 1];
        const val = (tip[1] / VSC) / Math.max(vs, 1e-3);
        const txt = (val >= 0 ? '+' : '-') + Math.abs(val).toFixed(1) + 'K';
        const pop = 1 + 0.25 * (1 - ex(t, bt(16), 0.3, 6)) * (t >= bt(16) ? 1 : 0);
        const ls = ex(t, bt(15), 0.12, 5) * pop * (1 - fl);
        const below = val < 0;
        const size = 36 * scl;
        const base = below ? tipS[1] + 0.7 * size + 18 : tipS[1] - 20;
        if (ls > 0.01) {
          Fr.add(counterStr(txt, size, tipS[0] - 14, base, WHITE, ls),
            { id: 'tip', ax: tipS[0] - 60, ay: base - 15, bb: [tipS[0] - 14 - 180 * ls, base - size * ls, tipS[0] - 14, base + 4] });
        }
      }
      // title rises out of its own baseline
      const tp = P(0, 6.6 * VSC);
      const tsize = 27 * scl;
      const rise = ex(t, bt(15) + 0.05, 0.34, 6), drop = ex(t, bt(17), 0.1, 6);
      const dy = 46 * (1 - rise) + 46 * drop;
      const run = RUN.GOLD, track = 0.42 * tsize, wT = (run.width * tsize) / UPM + track * (run.len - 1);
      const clip = Fr.clipRect(0, 0, W, tp[1] + 6);
      let s = '';
      for (const g of run.glyphs) s += glyphStr(g, tsize, tp[0] - wT / 2 + (g.cx * tsize) / UPM + track * g.idx, tp[1] + dy, 1, 1, GOLD);
      Fr.add(s, { id: 'title', ax: tp[0], ay: tp[1] + dy, bb: [tp[0] - wT / 2, tp[1] + dy - tsize, tp[0] + wT / 2, tp[1] + dy] }, clip);
    }
    // minute labels rise out of their baselines (beat 14), drop back in (beat 17)
    [['T10', 4], ['T20', 9], ['T30', 14]].forEach(([key, k], j) => {
      const p = P(COLX(k), -4.1 * VSC);
      const size = 25 * scl;
      const dy = 40 * (1 - ex(t, bt(14) + 0.1 + 0.04 * j, 0.34, 6)) + 40 * ex(t, bt(17), 0.1, 6);
      const clip = Fr.clipRect(0, 0, W, p[1] + 5);
      Fr.add(runStr(key, size, p[0], p[1] + dy, GOLD), { id: 'm' + j, ax: p[0], ay: p[1] + dy, bb: [p[0] - 60, p[1] + dy - size, p[0] + 60, p[1] + dy] }, clip);
    });
  }
}

// ═══════════════════════════ BAR 5 — UI: the axis folds into Q W E R ═══════════════════════════
const HUD = { s: 200, gap: 44, manaW: 932, manaY: CY + 100 + 34, manaH: 12, size: 132 };
const hudCx = (k) => CX + (k - 1.5) * (HUD.s + HUD.gap);
const CAST = [bt(18), bt(19), bt(20), bt(21)];
const HUD_T0 = bt(17) + 0.1;                 // the chart is a flat line by now
const HUD_KEYS = ['Q', 'W', 'E', 'R'];
function hud(Fr, t) {
  const sc = 1 / mapPush(HUD_T0);
  const x0 = CX - AXIS_HALF * sc, segL = (2 * AXIS_HALF * sc) / 4;
  const fo = ex(t, HUD_T0, 0.38, 6);
  const cl = ex(t, bt(21), 0.1, 6);                               // beat 21: R collapses it all into a blade
  if (cl >= 0.999) return;
  const lw = lerp(LANE * sc, 6, fo);
  for (let k = 0; k < 4; k++) {
    const link = lerp(segL / 4, HUD.s, fo), th = (Math.PI / 2) * fo;
    const P = [[0, 0]];
    for (let j = 0; j < 4; j++) { const p = P[j]; P.push([p[0] + link * Math.cos(-th * j), p[1] + link * Math.sin(-th * j)]); }
    let mx = 0, my = 0;
    for (let j = 0; j < 4; j++) { mx += (P[j][0] + P[j + 1][0]) / 8; my += (P[j][1] + P[j + 1][1]) / 8; }
    const tx = lerp(x0 + segL * (k + 0.5), hudCx(k), fo), ty = CY;
    // casting pop
    const tc = CAST[k];
    const pulse = t >= tc ? ex(t, tc, 0.05, 4) * (1 - ex(t, tc + 0.05, 0.35, 5)) : 0;
    const pop = 1 + 0.09 * pulse;
    const qx = hudCx(k);
    const pts = P.map(([x, y]) => {
      let X = tx + (x - mx) * pop, Y = ty + (y - my) * pop;
      // collapse: squash to the blade, spread to a quarter of [540, 1380]
      const l = qx - HUD.s / 2, q4 = HUD.manaW / 4;
      X = lerp(X, CX - HUD.manaW / 2 + q4 * k + (X - l) * (q4 / HUD.s), cl);
      Y = lerp(Y, CY, cl);
      return [X, Y];
    });
    const d = fo > 0.995 ? dPoly(pts.slice(0, 4)) : 'M' + pts.map((p) => n1(p[0]) + ' ' + n1(p[1])).join('L');
    const g = RUN[HUD_KEYS[k]].glyphs[0];
    const half = (HUD.s / 2 - 4) * pop;
    const ix = qx - half, iy = CY - half * (1 - cl), iw = 2 * half, ih = 2 * half * (1 - cl);
    const r = ex(t, HUD_T0 + 0.24 + 0.035 * k, 0.34, 6.5);
    const base = CY + (((g.bb[1] + g.bb[3]) / 2) * (HUD.size / UPM) + 140 * (1 - r)) * (1 - cl);
    // key letters rise from each square's floor
    if (t >= HUD_T0 + 0.24 && ih > 0.5) {
      const cid = Fr.clipRect(ix, iy, iw, ih);
      Fr.add(glyphStr(g, HUD.size, qx, base, pop, pop * (1 - cl), GOLD), { id: 'key' + k, ax: qx, ay: base - 45, bb: [qx - 80, base - 110, qx + 80, base + 40] }, cid);
    }
    // cast: the square fills gold, the gold sweeps away clockwise (cooldown), the letter inverts under it
    if (fo > 0.99 && t >= tc) {
      const pf = 1 - eInOut(seg(t, tc + 0.05, 0.38), 4.5);
      if (pf > 0.025 && ih > 0.5) {
        const cid = Fr.clipRect(ix, iy, iw, ih);
        const R = 140;
        let pd;
        if (pf >= 0.999) pd = `M${n1(ix)} ${n1(iy)}h${n1(iw)}v${n1(ih)}h${n1(-iw)}Z`;
        else {
          const a0 = -Math.PI / 2 + Math.PI * 2 * (1 - pf), a1 = Math.PI * 1.5;
          pd = `M${qx} ${CY}L${n1(qx + R * Math.cos(a0))} ${n1(CY + R * Math.sin(a0))}A${R} ${R} 0 ${a1 - a0 > Math.PI ? 1 : 0} 1 ${n1(qx + R * Math.cos(a1))} ${n1(CY + R * Math.sin(a1))}Z`;
        }
        Fr.add(`<path d="${pd}" fill="${GOLD}"/>`, null, cid);
        const pc = Fr.clipPath(pd);
        Fr.add(`<g clip-path="url(#${pc})">${glyphStr(g, HUD.size, qx, base, pop, pop * (1 - cl), BLACK)}</g>`, null, cid);
      }
    }
    Fr.add(`<path d="${d}" fill="none" stroke="${GOLD}" stroke-width="${n2(lw)}" stroke-linejoin="miter" stroke-linecap="butt"/>`);
  }
  // mana bar: draws out from the centre, drains a step per cast, then joins the blade
  const mb = ex(t, HUD_T0 + 0.26, 0.4, 6);
  if (mb > 0.002) {
    let level = 1, lag = 1;
    for (let c = 0; c < 3; c++) { level -= 0.17 * ex(t, CAST[c], 0.3, 6); lag -= 0.17 * ex(t, CAST[c] + 0.12, 0.3, 6); }
    const y = lerp(HUD.manaY, CY - 3, cl), h = lerp(HUD.manaH, 6, cl);
    const L0 = CX - (HUD.manaW / 2) * mb, full = HUD.manaW * mb;
    const X0 = lerp(L0, CX - HUD.manaW / 2, cl), X1 = lerp(L0 + full * level, CX + HUD.manaW / 2, cl);

// ═══════════════════════════ BAR 6 — KINETIC TYPE: the ultimate writes the kills ═══════════════════════════
const KILLS = [
  { key: 'DOUBLE', t: bt(21), size: 190, n: 2, col: GOLD },
  { key: 'TRIPLE', t: bt(22), size: 210, n: 3, col: GOLD },
  { key: 'QUADRA', t: bt(23), size: 215, n: 4, col: GOLD },
  { key: 'PENTA', t: bt(24), size: 270, n: 5, col: RED },

const killBase = (k) => CY + 0.35 * k.size;
function killBand(k) {
  const run = RUN[k.key], s = k.size / UPM, b = killBase(k);
  return [b - run.ymax * s - 8, b - run.ymin * s + 8];
}
const KILL_DIST = 1780;
function kills(Fr, t) {

  const k0 = KILLS[0];
  const [y0T, y0B] = killBand(k0);
  const ext = ex(t, k0.t + 0.03, 0.2, 6);
  const op = ex(t, k0.t + 0.05, 0.3, 6.5);
  const bl = ex(t, k0.t + 0.24, 0.22, 6);
  if (bl < 0.999) {
    const xa = lerp(CX - HUD.manaW / 2, 170, ext), xb = lerp(CX + HUD.manaW / 2, W - 170, ext);
    const hw = ((xb - xa) / 2) * (1 - bl);
    const yu = CY - (CY - y0T + 6) * op, yd = CY + (y0B - CY + 6) * op;
    Fr.add(lineStr(CX - hw, yu, CX + hw, yu, GOLD, 5, 'butt'), { id: 'jawU', ax: CX, ay: yu, bb: [CX - hw, yu - 4, CX + hw, yu + 4] });
    Fr.add(lineStr(CX - hw, yd, CX + hw, yd, GOLD, 5, 'butt'), { id: 'jawD', ax: CX, ay: yd, bb: [CX - hw, yd - 4, CX + hw, yd + 4] });
  }

  while (j < KILLS.length - 1 && t >= KILLS[j + 1].t) j++;

  const [yT, yB] = killBand(K);
  if (j === 0) {
    // DOUBLE KILL rides the jaws: the upper half rises with the top line, the lower half drops with the bottom one
    const halves = [[CY - (CY - yT) * op, CY, (CY - yT) * (1 - op)], [CY, CY + (yB - CY) * op, -(yB - CY) * (1 - op)]];
    halves.forEach(([a, b, dy], i) => {
      if (b - a < 0.5) return;
      const cid = Fr.clipRect(0, a, W, b - a);
      Fr.add(runStr(K.key, K.size, CX, killBase(K), K.col, 0, dy), { id: 'k0s' + i, ax: CX, ay: (yT + yB) / 2 + dy, bb: [CX - 700, yT + dy, CX + 700, yB + dy] }, cid);
    });
    return;
  }

  const n = K.n, hS = (yB - yT) / n;
  for (let i = 0; i < n; i++) {
    const a = yT + hS * i, sl = ex(t, K.t + 0.02 + 0.006 * i, 0.22, 8);
    const dir = i % 2 === 0 ? 1 : -1;
    const cid = Fr.clipRect(0, a, W, hS + 0.6);
    const dxOld = dir * KILL_DIST * sl, dxNew = -dir * KILL_DIST * (1 - sl);
    const svg = runStr(prev.key, prev.size, CX, killBase(prev), prev.col, dxOld) + runStr(K.key, K.size, CX, killBase(K), K.col, dxNew);
    Fr.add(svg, { id: 'k' + j + 's' + i, ax: CX + dxNew, ay: a + hS / 2, bb: [CX + dxNew - 900, a, CX + dxNew + 900, a + hS] }, cid);
  }
  // blades sweep across each cut
  for (let i = 1; i < n; i++) {
    const y = yT + hS * i, lead = ex(t, K.t, 0.08, 5), tail = ex(t, K.t + 0.05, 0.13, 5);
    if (tail >= 0.999) continue;
    const l2r = i % 2 === 1;
    const xa = lerp(120, 1800, tail), xb = lerp(120, 1800, lead);
    const p0 = l2r ? xa : W - xa, p1 = l2r ? xb : W - xb;
    Fr.add(lineStr(p0, y, p1, y, GOLD, 4, 'butt'), { id: 'bl' + j + i, ax: p1, ay: y, bb: [Math.min(p0, p1), y - 3, Math.max(p0, p1), y + 3] });
  }
}

// ═══════════════════════════ BAR 7 — THE PUSH: down mid lane to the Nexus ═══════════════════════════
// PENTAKILL lies down on the floor (hinge tilt around it), then the camera charges down the mid lane

const CL = { B: [0, -900], R: [0, 2950], L: [-1925, 1025], T: [1925, 1025], towers: [[-66, 1350], [66, 1850], [-66, 2300]], inhib: 2600, nexus: [0, 230, 2950] };
const CL_SIDE = [[CL.B, CL.L, CL.R], [CL.B, CL.T, CL.R]];
const CL_SIDE_TOWERS = [];
CL_SIDE.forEach((lane, li) => [0.2, 0.32, 0.44, 0.56, 0.68, 0.8].forEach((s, j) => {
  const p = along(lane, s);
  CL_SIDE_TOWERS.push({ X: p[0], Z: p[1], team: s < 0.5 ? 'b' : 'r', i: li * 6 + j });

const CL_WALLS = [];
for (let z = 330; z < 2420; z += 250) {

function climaxCam(t) {

  phi = lerp(phi, 6, ex(t, bt(25) + 0.15, 0.4, 4));

  if (t < bt(26)) {

      for (const poly of polys) d += floorPolyStr(cam, poly.map(([u, v]) => [left + s * (g.x + u) - CX, CY - base + s * v]));
      if (!d) continue;

      Fr.add(`<path d="${d}" fill="${RED}"/>`, c ? { id: 'pf' + g.x, ax: c[0], ay: c[1], bb: [c[0] - 500, c[1] - 500, c[0] + 500, c[1] + 500] } : null);
    }

  rings.forEach(([z, r0, n, w], i) => {

function nexusSolid(cam, t) {

// ═══════════════════════════ END TITLE — VICTORY, then back to the line ═══════════════════════════
const VT = { size: 250, cap: 175, base: CY + 87.5 };
function title(Fr, t) {
  const s = VT.size / UPM, RV = RUN.VICTORY, wV = RV.width * s;
  const bxMax = wV / 2 + 26;

  const close = ex(t, bt(30) + 0.16, 0.34, 6);           // lands exactly on 15.0
  const pv = unfold * (1 - close);
  // the Nexus is cut in two; its halves fold into the brackets
  const q = ex(t, bt(29) + 0.05, 0.4, 6.5);
  if (t >= bt(29) + 0.05 && q < 0.985) {
    const cam = climaxCam(t);
    const nx = nexusSolid(cam, t);
    if (nx) {
      const hgt = Math.max(40, nx.bb[3] - nx.bb[1]);
      const ky = lerp(1, VT.cap / hgt, q);
      const col = mix(RED, GOLD, ex(t, bt(29) + 0.1, 0.3, 6));
      const svg = nx.svg.replace(/fill="[^"]+"/, `fill="${col}"`);
      for (const sg of [-1, 1]) {
        const a = 1 - q, e = q * (CX + sg * bxMax), f = CY - CY * ky;
        const cid = Fr.clipRect(sg < 0 ? 0 : CX, 0, sg < 0 ? CX : W - CX, H);
        const T = (xx, yy) => [a * xx + e, ky * yy + f];
        const A = T(sg < 0 ? nx.bb[0] : CX, nx.bb[1]), B = T(sg < 0 ? CX : nx.bb[2], nx.bb[3]);
        Fr.add(`<g transform="matrix(${n4(a)} 0 0 ${n4(ky)} ${n2(e)} ${n2(f)})"><g clip-path="url(#${cid})">${svg}</g></g>`,
          { id: 'nh' + sg, ax: (A[0] + B[0]) / 2, ay: (A[1] + B[1]) / 2, bb: [Math.min(A[0], B[0]), A[1], Math.max(A[0], B[0]), B[1]] });
      }
    }
  }

  const shrink = ex(t, bt(29) + 0.1, 0.32, 6);

  const bcol = mix(WHITE, GOLD, ex(t, bt(29) + 0.1, 0.3, 6));
  const bx = bxMax * pv;
  for (const sg of [-1, 1]) {
    const x = CX + sg * bx;
    Fr.add(lineStr(x, top, x, bot, bcol, 6), { id: 'vb' + sg, ax: x, ay: (top + bot) / 2, bb: [x - 6, top, x + 6, bot] });
  }
  // VICTORY unfolds like an accordion from the cut, folds back into it at the end
  if (pv > 0.003) {
    RV.glyphs.forEach((g, i) => {
      const gx = CX + (gX(RV, g, VT.size, CX) - CX) * pv;
      Fr.add(glyphStr(g, VT.size, gx, VT.base, pv, 1, GOLD), { id: 'V' + i, ax: gx, ay: VT.base - VT.cap / 2, bb: glyphBox(g, VT.size, gx, VT.base, pv, 1) });

      Fr.add(lineStr(CX + gap, y, CX + hw, y, GOLD, 3, 'butt'), { id: 'ornR', ax: CX + (hw + gap) / 2, ay: y, bb: [CX + gap, y - 2, CX + hw, y + 2] });
    }
    const dm = 13 * spr(t - bt(30) - 0.04, 3.5, 0.75, 6) * (1 - close);
    if (dm > 0.3) Fr.add(`<path d="M${CX} ${n1(y - dm)}L${n1(CX + dm)} ${y}L${CX} ${n1(y + dm)}L${n1(CX - dm)} ${y}Z" fill="${GOLD}"/>`);
  }
}

// ═══════════════════════════ timeline ═══════════════════════════
function build(t) {
  const Fr = new Frame(t);
  if (t < bt(5)) hook(Fr, t);
  if (t >= bt(5) && t < HUD_T0) mapWorld(Fr, t);
  if (t >= HUD_T0 && t < bt(21) + 0.12) hud(Fr, t);
  if (t >= bt(21) && t < bt(25)) kills(Fr, t);
  if (t >= bt(25)) climax(Fr, t);
  if (t >= bt(29)) title(Fr, t);
  return Fr;
}
const wrapT = (x) => ((x % DUR) + DUR) % DUR;

const stage = document.getElementById('stage');
function frameSVG(t) {
  t = wrapT(t);
  const cur = build(t);
  const prev = build(wrapT(t - DT));
  const pm = new Map();
  for (const it of prev.items) if (it.mb) pm.set(it.mb.id, it.mb);
  let body = '', fid = 0;
  const defs = cur.defs.slice();
  for (const it of cur.items) {
    let svg = it.svg;
    const p = it.mb && pm.get(it.mb.id);
    if (p) {
      const vx = (it.mb.ax - p.ax) / DT, vy = (it.mb.ay - p.ay) / DT;
      const sig = Math.min((BLUR_K * Math.hypot(vx, vy)) / FPS, BLUR_MAX);
      if (sig >= BLUR_MIN) {
        const ang = Math.atan2(vy, vx), deg = (ang * 180) / Math.PI;
        const { ax, ay } = it.mb;
        const bb = it.mb.bb;
        const c = Math.cos(-ang), s = Math.sin(-ang);
        let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
        for (const [x, y] of [[bb[0], bb[1]], [bb[2], bb[1]], [bb[2], bb[3]], [bb[0], bb[3]]]) {
          const dx = x - ax, dy = y - ay, rx = ax + dx * c - dy * s, ry = ay + dx * s + dy * c;
          x0 = Math.min(x0, rx); y0 = Math.min(y0, ry); x1 = Math.max(x1, rx); y1 = Math.max(y1, ry);
        }
        const id = 'mb' + fid++;
        const m = 3 * sig + 4;
        defs.push(`<filter id="${id}" filterUnits="userSpaceOnUse" x="${n1(x0 - m)}" y="${n1(y0 - 4)}" width="${n1(x1 - x0 + 2 * m)}" height="${n1(y1 - y0 + 8)}" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="${n2(sig)} 0"/></filter>`);
        svg = `<g transform="rotate(${n2(deg)} ${n1(ax)} ${n1(ay)})"><g filter="url(#${id})"><g transform="rotate(${n2(-deg)} ${n1(ax)} ${n1(ay)})">${svg}</g></g></g>`;
      }
    }
    body += it.clip ? `<g clip-path="url(#${it.clip})">${svg}</g>` : svg;
  }
  return `<defs>${defs.join('')}</defs><rect width="${W}" height="${H}" fill="${BLACK}"/>${body}`;
}
window.seek = function (t) { stage.innerHTML = frameSVG(t); };
window.DURATION = DUR;
window.BEATS = Array.from({ length: 30 }, (_, i) => i * BEAT);
window.seek(0);

// ═══════════════════════════ SOUNDTRACK (Web Audio, offline) ═══════════════════════════

window.renderAudio = async function () {

  for (let c = 0; c < 2; c++) {
    const d = ir.getChannelData(c);
    for (let i = 0; i < d.length; i++) { const x = i / d.length; d[i] = rnd() * Math.pow(1 - x, 3.4) * Math.min(1, i / 200); }
  }
  const verb = ctx.createConvolver(); verb.buffer = ir;
  const vret = ctx.createGain(); vret.gain.value = 0.32; verb.connect(vret); vret.connect(master);

  // sidechain pump bus for the tonal parts
  const pump = ctx.createGain(); pump.connect(master);
  pump.gain.setValueAtTime(1, 0);
  for (let b = 0; b < 2 * LEN; b++) {
    const tb = b * BEAT;
    pump.gain.setValueAtTime(0.22, tb);
    pump.gain.linearRampToValueAtTime(1, tb + 0.2);
  }

  const noise = (t, dur, rate = 1) => {
    const s = ctx.createBufferSource(); s.buffer = nbuf; s.loop = true; s.playbackRate.value = rate;
    s.start(t, (t * 0.731) % 1.9); s.stop(t + dur + 0.05); return s;
  };
  const gainEnv = (t, a, peak, d, dest) => {
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.00001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.00001, t + a + d);
    g.connect(dest); return g;
  };
  const filt = (type, f, Q = 0.7) => { const b = ctx.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = Q; return b; };
  const pan = (p, dest) => { const s = ctx.createStereoPanner(); s.pan.value = p; s.connect(dest); return s; };
  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);

  function kick(t, amp = 0.95, big = false) {
    const o = ctx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(big ? 200 : 168, t);
    o.frequency.exponentialRampToValueAtTime(52, t + 0.07);
    o.frequency.exponentialRampToValueAtTime(40, t + (big ? 0.6 : 0.35));
    const g = gainEnv(t, 0.002, amp, big ? 0.75 : 0.4, master);
    o.connect(g); o.start(t); o.stop(t + 0.9);
    const n = noise(t, 0.02); const hp = filt('highpass', 2500); n.connect(hp); hp.connect(gainEnv(t, 0.001, amp * 0.35, 0.018, master));
  }
  function clap(t, amp = 0.32) {
    const n = noise(t, 0.3); const bp = filt('bandpass', 1350, 0.9); n.connect(bp);
    const g = ctx.createGain(); g.gain.setValueAtTime(0, t);
    [0, 0.011, 0.022].forEach((o) => { g.gain.setValueAtTime(amp, t + o); g.gain.exponentialRampToValueAtTime(amp * 0.25, t + o + 0.009); });
    g.gain.setValueAtTime(amp, t + 0.033); g.gain.exponentialRampToValueAtTime(0.00001, t + 0.24);
    bp.connect(g); g.connect(master); g.connect(verb);
  }
  function hat(t, amp = 0.1, len = 0.035) {
    const n = noise(t, len + 0.02, 1.3); const hp = filt('highpass', 8200); n.connect(hp); hp.connect(gainEnv(t, 0.001, amp, len, pan(0.18, master)));
  }
  function hit(t, amp = 0.6, root = 50) {
    const o = ctx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(mtof(root - 12) * 1.6, t); o.frequency.exponentialRampToValueAtTime(mtof(root - 12) * 0.6, t + 0.7);
    o.connect(gainEnv(t, 0.003, amp * 0.9, 1.1, master)); o.start(t); o.stop(t + 1.3);
    const n = noise(t, 1.2); const lp = filt('lowpass', 7000); const hp = filt('highpass', 320); n.connect(lp); lp.connect(hp);
    const g = gainEnv(t, 0.002, amp * 0.5, 0.9, master); hp.connect(g); g.connect(verb);
    [1, 2.76, 5.4, 8.93].forEach((r, i) => {
      const b = ctx.createOscillator(); b.type = 'sine'; b.frequency.value = mtof(root + 24) * r;
      const bg = gainEnv(t, 0.002, (amp * 0.09) / (i + 1), 1.4 / (1 + i * 0.5), pan(i % 2 ? 0.45 : -0.45, master));
      b.connect(bg); bg.connect(verb); b.start(t); b.stop(t + 2);
    });
  }
  function whoosh(t, dur, f0, f1, amp = 0.2, p = 0) {
    const n = noise(t, dur); const bp = filt('bandpass', f0, 1.4); n.connect(bp);
    bp.frequency.setValueAtTime(f0, t); bp.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = ctx.createGain(); g.gain.setValueAtTime(0.00001, t); g.gain.exponentialRampToValueAtTime(amp, t + dur * 0.35); g.gain.exponentialRampToValueAtTime(0.00001, t + dur);
    bp.connect(g); g.connect(pan(p, master)); g.connect(verb);
  }
  function slash(t, amp = 0.35, pitch = 1) {
    const n = noise(t, 0.2); const hp = filt('highpass', 3500 * pitch); const bp = filt('bandpass', 7000 * pitch, 5); n.connect(hp); hp.connect(bp);
    bp.connect(gainEnv(t, 0.002, amp, 0.11, master));
    [3150, 4630].forEach((f, i) => {
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f * pitch;
      const g = gainEnv(t + 0.01, 0.002, amp * 0.07, 0.5, pan(i ? 0.3 : -0.3, master)); o.connect(g); g.connect(verb); o.start(t); o.stop(t + 0.7);
    });
  }
  function blip(t, m0, m1, amp = 0.16) {
    const o = ctx.createOscillator(); o.type = 'triangle';
    o.frequency.setValueAtTime(mtof(m0), t); o.frequency.exponentialRampToValueAtTime(mtof(m1), t + 0.07);
    const g = gainEnv(t, 0.003, amp, 0.22, master); o.connect(g); g.connect(verb); o.start(t); o.stop(t + 0.4);
  }
  function thunk(t, amp = 0.3) {
    const o = ctx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(55, t + 0.2);
    o.connect(gainEnv(t, 0.002, amp, 0.25, master)); o.start(t); o.stop(t + 0.4);
    const n = noise(t, 0.3); const lp = filt('lowpass', 900); n.connect(lp); lp.connect(gainEnv(t, 0.002, amp * 0.4, 0.2, master));
  }
  function crunch(t, amp = 0.45) {
    const n = noise(t, 0.5, 0.6); const lp = filt('lowpass', 520); n.connect(lp); lp.connect(gainEnv(t, 0.003, amp, 0.38, master));
    const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(95, t); o.frequency.exponentialRampToValueAtTime(38, t + 0.35);
    o.connect(gainEnv(t, 0.002, amp * 0.8, 0.4, master)); o.start(t); o.stop(t + 0.5);
  }
  function stab(t, notes, amp = 0.09, dur = 0.55, cutoff = 1800) {
    const lp = filt('lowpass', cutoff, 1.2);
    lp.frequency.setValueAtTime(cutoff * 2.5, t); lp.frequency.exponentialRampToValueAtTime(cutoff * 0.5, t + dur);
    const g = gainEnv(t, 0.004, amp, dur, pump); lp.connect(g); g.connect(verb);
    notes.forEach((m) => [-6, 6].forEach((dt) => {
      const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = mtof(m); o.detune.value = dt;
      o.connect(lp); o.start(t); o.stop(t + dur + 0.1);
    }));
  }
  function pluck(t, m, amp, cutoff) {
    const lp = filt('lowpass', cutoff, 2);
    lp.frequency.setValueAtTime(cutoff, t); lp.frequency.exponentialRampToValueAtTime(Math.max(300, cutoff * 0.2), t + 0.12);
    const g = gainEnv(t, 0.002, amp, 0.16, pump); lp.connect(g);
    const g2 = ctx.createGain(); g2.gain.value = 0.25; g.connect(g2); g2.connect(verb);
    [['sawtooth', 0], ['square', 7]].forEach(([type, dt]) => { const o = ctx.createOscillator(); o.type = type; o.frequency.value = mtof(m); o.detune.value = dt; o.connect(lp); o.start(t); o.stop(t + 0.25); });
  }

  // harmony (MIDI): bars → chord tones
  const CH = [
    [0, [62, 65, 69, 74]],   // Dm
    [2, [58, 62, 65, 70]],   // Bb
    [4, [65, 69, 72, 77]],   // F
    [6, [60, 64, 67, 72]],   // C
    [8, [62, 65, 69, 74]],   // Dm
    [10, [58, 62, 65, 70]],  // Bb
    [11.5, [57, 61, 64, 69]],// A (dominant)
    [12, [58, 62, 65, 70]],  // Bb
    [13, [60, 64, 67, 72]],  // C
    [14, [62, 66, 69, 74]],  // D major — VICTORY
    [15, [62, 65, 69, 74]],
  ];
  const chordAt = (t) => { let c = CH[0][1]; for (const [t0, n] of CH) if (t >= t0) c = n; return c; };

  // bass: one voice per chord from bar 2, pumped by the kick
  for (let i = 1; i < CH.length - 1; i++) {
    const [t0, n] = CH[i], t1 = CH[i + 1][0];
    const root = mtof(n[0] - 24), lvl = t0 >= 12 ? 0.19 : 0.15;
    const lp = filt('lowpass', 420, 0.9); const g = ctx.createGain(); g.gain.value = 0.0001;
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(lvl, t0 + 0.02); g.gain.setValueAtTime(lvl, t1 - 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t1);
    lp.connect(g); g.connect(pump);
    [['sawtooth', root, 0.6], ['sine', root, 1.0]].forEach(([type, f, a]) => {
      const o = ctx.createOscillator(); o.type = type; o.frequency.value = f;
      const og = ctx.createGain(); og.gain.value = a; o.connect(og); og.connect(lp); o.start(t0); o.stop(t1 + 0.05);
    });
  }
  // soft pad an octave above the chord, bars 2–7, plus the VICTORY chord
  for (let i = 1; i < CH.length - 1; i++) {
    const [t0, n] = CH[i], t1 = CH[i + 1][0];
    const g = ctx.createGain(), lvl = t0 >= 14 ? 0.03 : t0 >= 10 && t0 < 12 ? 0.012 : 0.02;
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(lvl, t0 + 0.06); g.gain.setValueAtTime(lvl, Math.max(t0 + 0.07, t1 - 0.05)); g.gain.exponentialRampToValueAtTime(0.0001, t1 + (t0 >= 14 ? 1.2 : 0.02));
    g.connect(pump); g.connect(verb);
    n.slice(0, 3).forEach((m, k) => {
      const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = mtof(m + 12); o.detune.value = (k - 1) * 5;
      o.connect(g); o.start(t0); o.stop(t1 + (t0 >= 14 ? 1.3 : 0.05));
    });
  }
  // arpeggio, 16ths, from bar 2; opens up through the build
  const ARP = [0, 2, 1, 3, 2, 1, 3, 2];
  for (let i = 8 * 2; i < 15 * 8 - 0; i++) {
    const t = i * 0.125;
    if (t >= 11.98 && t < 12.0) continue;
    if (t >= 14.0) break;
    const tones = chordAt(t);
    const m = tones[ARP[i % 8]] + (t >= 12 ? 12 : 0);
    const build = seg(t, 10, 2);
    pluck(t, m, 0.085 + 0.04 * build, 2400 + 5200 * build + (t >= 12 ? 1800 : 0));
  }
  // drums
  for (let b = 0; b < 30; b++) {
    const t = b * BEAT;
    const big = t === 12 || t === 0 || t === 14;
    kick(t, big ? 1 : 0.92, big);
    if (t >= 2 && t < 14) hat(t + 0.25, 0.2);
    if (t >= 4 && t < 14) { hat(t + 0.125, t >= 10 ? 0.1 : 0.06, 0.02); hat(t + 0.375, t >= 10 ? 0.1 : 0.06, 0.02); }
    if (t >= 4 && t < 14 && b % 2 === 1 && !(t >= 10 && t < 12)) clap(t, 0.36);
  }
  // scene-change hits (every bar) + chord stabs
  [0, 2, 4, 6, 8, 10, 12, 14].forEach((t) => {
    const c = chordAt(t);
    hit(t, t === 12 ? 0.85 : t === 14 ? 0.75 : 0.55, c[0]);
    stab(t, c.map((m) => m - 12), t === 14 ? 0.17 : 0.11, t === 14 ? 1.3 : 0.6, t === 14 ? 2800 : 1900);
  });
  // the riser into the last full bar
  {
    const t0 = 10, t1 = 11.985;
    const n = noise(t0, t1 - t0); const bp = filt('bandpass', 300, 3.5); n.connect(bp);
    bp.frequency.setValueAtTime(300, t0); bp.frequency.exponentialRampToValueAtTime(9500, t1);
    const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.42, t1); g.gain.setValueAtTime(0, t1 + 0.001);
    bp.connect(g); g.connect(master); g.connect(verb);
    [-9, 9].forEach((dt) => {
      const o = ctx.createOscillator(); o.type = 'sawtooth'; o.detune.value = dt;
      o.frequency.setValueAtTime(mtof(50), t0); o.frequency.exponentialRampToValueAtTime(mtof(86), t1);
      const lp = filt('lowpass', 600, 2); lp.frequency.setValueAtTime(600, t0); lp.frequency.exponentialRampToValueAtTime(7000, t1);
      const og = ctx.createGain(); og.gain.setValueAtTime(0.0001, t0); og.gain.exponentialRampToValueAtTime(0.07, t1); og.gain.setValueAtTime(0, t1 + 0.001);
      o.connect(lp); lp.connect(og); og.connect(master); o.start(t0); o.stop(t1 + 0.01);
    });
    // snare roll accelerating into the drop
    const roll = [];
    for (let t = 10; t < 11; t += 0.25) roll.push(t);
    for (let t = 11; t < 11.5; t += 0.125) roll.push(t);
    for (let t = 11.5; t < 11.98; t += 0.0625) roll.push(t);
    roll.forEach((t) => clap(t, 0.08 + 0.22 * seg(t, 10, 2)));
  }
  // sound design locked to picture
  whoosh(0, 0.45, 600, 2600, 0.12);
  thunk(bt(2), 0.32);
  slash(bt(3), 0.42);
  whoosh(bt(4), 0.5, 2400, 500, 0.26, 0);
  whoosh(bt(5), 0.35, 900, 2200, 0.08);
  whoosh(bt(6), 0.4, 400, 1200, 0.1);
  blip(bt(7), 74, 86, 0.1);
  for (let i = 0; i < 3; i++) blip(bt(8) + 0.045 * i, 93 + i * 2, 98 + i * 2, 0.07);
  whoosh(bt(9), 0.55, 300, 1400, 0.16);
  thunk(bt(10), 0.34); thunk(bt(11), 0.34);
  blip(bt(12), 86, 98, 0.08);
  whoosh(bt(13), 0.5, 1800, 500, 0.16);
  whoosh(bt(14), 0.45, 500, 1600, 0.1);
  { const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(400, bt(15)); o.frequency.exponentialRampToValueAtTime(1600, bt(15) + 0.42); o.connect(gainEnv(bt(15), 0.02, 0.06, 0.4, master)); o.start(bt(15)); o.stop(bt(15) + 0.5); }
  whoosh(bt(16), 0.4, 300, 900, 0.1);
  for (let k = 0; k < 4; k++) blip(bt(17) + 0.1 + 0.03 * k, 81 + k, 88 + k, 0.06);
  blip(bt(18), 81, 93, 0.18); blip(bt(19), 84, 96, 0.18); blip(bt(20), 86, 98, 0.18);
  blip(bt(21), 74, 98, 0.22); slash(bt(21) + 0.03, 0.3, 0.8);
  slash(bt(22), 0.32, 0.9); slash(bt(23), 0.34, 1.0); slash(bt(24), 0.38, 1.12);
  whoosh(bt(25), 0.7, 3000, 250, 0.32);
  { const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(48, 12); o.frequency.exponentialRampToValueAtTime(30, 13.2); o.connect(gainEnv(12, 0.004, 0.5, 1.2, master)); o.start(12); o.stop(13.4); }
  crunch(bt(26)); crunch(bt(27)); crunch(bt(28), 0.5);
  whoosh(bt(26), 0.4, 1200, 300, 0.14, -0.3); whoosh(bt(27), 0.4, 1200, 300, 0.14, 0.3); whoosh(bt(28), 0.45, 1200, 260, 0.16);
  slash(bt(29), 0.45, 0.95);
  blip(bt(30), 86, 93, 0.08);
  // reverse swell into the loop point
  {
    const t0 = 14.62, t1 = 15.0;
    const n = noise(t0, t1 - t0); const bp = filt('bandpass', 1800, 1.2); n.connect(bp);
    bp.frequency.setValueAtTime(1800, t0); bp.frequency.exponentialRampToValueAtTime(5200, t1);
    const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.16, t1 - 0.005); g.gain.linearRampToValueAtTime(0, t1);
    bp.connect(g); g.connect(master);
  }

  const buf = await ctx.startRendering();
  const N = Math.round(SR * DUR);
  const L = new Float32Array(N), R = new Float32Array(N);
  const d0 = buf.getChannelData(0), d1 = buf.getChannelData(1);
  for (let i = 0; i < buf.length; i++) { const j = i % N; L[j] += d0[i]; R[j] += d1[i]; }
  let peak = 0;
  for (let i = 0; i < N; i++) peak = Math.max(peak, Math.abs(L[i]), Math.abs(R[i]));
  const gain = peak > 0 ? 0.891 / peak : 1;
  const bytes = new Uint8Array(44 + N * 4);
  const dv = new DataView(bytes.buffer);
  const ws = (o, s) => { for (let i = 0; i < s.length; i++) bytes[o + i] = s.charCodeAt(i); };
  ws(0, 'RIFF'); dv.setUint32(4, 36 + N * 4, true); ws(8, 'WAVE'); ws(12, 'fmt ');
  dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 2, true); dv.setUint32(24, SR, true);
  dv.setUint32(28, SR * 4, true); dv.setUint16(32, 4, true); dv.setUint16(34, 16, true); ws(36, 'data'); dv.setUint32(40, N * 4, true);
  for (let i = 0, o = 44; i < N; i++, o += 4) {
    const l = clamp(L[i] * gain, -1, 1), r = clamp(R[i] * gain, -1, 1);
    dv.setInt16(o, l < 0 ? l * 32768 : l * 32767, true); dv.setInt16(o + 2, r < 0 ? r * 32768 : r * 32767, true);
  }
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return { wav: btoa(bin), peak, gain };
};
